name: Apply Smart Queue source update

on:
  push:
    branches:
      - smartqueue-javafx-completion

permissions:
  contents: write

jobs:
  apply-source-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/sqms_update.patch.xz.b64 | xz --decompress --stdout > /tmp/sqms_update.patch
          git apply --check /tmp/sqms_update.patch
          git apply /tmp/sqms_update.patch
          rm -f .github/sqms_update.patch.xz.b64 .github/workflows/apply-sqms-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Smart Queue Management System workflows"
          git push
